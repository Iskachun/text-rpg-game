<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <h2 id="welcome"></h2>
        <button id="start_btn" onclick=gameStart()>click to start</button>
        
        <p id="text"></p>
        <button class="choice" id="c1" onclick=enter_village()>Follow the path</button>
        <button class="choice" id="c2" onclick=cont_forest()>Continue into the forest</button>

        <button class="choice" id="c3" onclick=village()>Enter the village</button>
        <button class="choice" id="c4" onclick=gameStart()>Return to the forest path</button>

        <button class="choice" id="c5" onclick=square()>Go to the main square</button>
        <button class="choice" id="c6" onclick=market()>Go to the market</button>
        <button class="choice" id="c7" onclick=inn()>Go to the inn</button>
        


        <button class="choice" id="s1">Pick it up</button>
        <button class="choice" id="s2">Don't pick it up</button>
        
        <br><br>
        <div class="inv">
            <h4>Inventory:</h4>

            <h5 class="invh5">Money:</h5>
            <p id="money">0</p>

            <h5 class="invh5">Items:</h5>
            <p id="inv_items">
                
            </p>

            <h5 class="invh5">Weapons:</h5>
            <p id="inv_weapons">
                
            </p>
        </div>
        <br><br>
        <button id="reset_btn" onclick=restart()>restart</button>
    </div>
    <script defer src="script.js"></script>
</body>
</html>
